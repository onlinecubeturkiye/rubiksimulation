name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor "#1a0f3a" --splashBackgroundColor "#1a0f3a"
          npx cap sync android
          python3 scripts/patch-android.py

      - name: Set version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"2.0.${{ github.run_number }}\"/" android/app/build.gradle

      # Sabit debug anahtarı: yeni sürümler eskisinin üstüne kurulur, ilerleme silinmez.
      - name: Use fixed debug key
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../KupArena.apk

      # Google Play dosyası (.aab). UPLOAD_KEY_PASSWORD ve UPLOAD_KEYSTORE_B64 gizli değişkenleri yoksa atlanır.
      - name: Build Play Store bundle
        working-directory: android
        env:
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$UPLOAD_KEY_PASSWORD" ] || [ -z "$UPLOAD_KEYSTORE_B64" ]; then echo "İmza gizli değişkenleri yok, AAB atlandı"; exit 0; fi
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > ../signing/upload.keystore
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../KupArena-GooglePlay.aab

      - name: Pack store listing files
        run: cd store && zip -qr ../KupArena-Magaza.zip .

      # Web sürümü: rubikacademy.fun/kup-arena/oyna/ bu dosyayı açıp yayınlar
      - name: Pack web version
        run: cd www && zip -qr ../KupArena-Web.zip .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kup-arena-apk
          path: KupArena.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Küp Arena 2.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            KupArena.apk
            KupArena-GooglePlay.aab
            KupArena-Magaza.zip
            KupArena-Web.zip
          body: |
            Telefona kurmak için aşağıdaki **KupArena.apk** dosyasını indir ve aç.
            İlk kurulumda "bilinmeyen kaynaklardan yükleme" izni istenebilir.

            **Google Play için:** KupArena-GooglePlay.aab (Play Console'a yüklenecek dosya) ve
            KupArena-Magaza.zip (simge, tanıtım görseli, ekran görüntüleri, açıklamalar).
